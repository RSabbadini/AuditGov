# ============================================================
# AuditGov - configuração base
# ============================================================
quarkus.application.name=auditgov
quarkus.application.version=1.0.0-SNAPSHOT
quarkus.http.port=8080

# ------------------------------------------------------------
# AuditGov
# ------------------------------------------------------------
# Liga/desliga o interceptador (false = sem auditoria; útil para comparar desempenho).
auditgov.enabled=true

# O que fazer se a evidência não puder ser gravada:
#   lenient = registra ERROR no log e responde normalmente (há perda de evidência sem aviso);
#   strict  = responde 503 e não entrega o dado ("sem registro, sem acesso").
auditgov.failure-mode=lenient

# Instala no PostgreSQL o gatilho que bloqueia UPDATE, DELETE e TRUNCATE em audit_log
# (arquivo src/main/resources/db/audit-append-only.sql).
auditgov.append-only.enabled=true

# Chave do HMAC usado para pseudonimizar o titular (subject_ref) e para a impressão digital
# do conteúdo (payload_hash). Em produção, defina AUDITGOV_HMAC_KEY (a aplicação não sobe
# em modo de produção com a chave de desenvolvimento). A chave NÃO deve ficar no banco.
auditgov.hmac.key=${AUDITGOV_HMAC_KEY:auditgov-dev-key-nao-usar-em-producao}

# ------------------------------------------------------------
# Autenticação: JWT (SmallRye JWT)
# ------------------------------------------------------------
# A aplicação só VALIDA tokens; quem os emite é o provedor de identidade (IdP). O operador
# gravado na trilha é o principal do token validado (claim upn, preferred_username ou sub);
# o papel vem da claim groups (operador, auditor).
#
# Aqui está a chave PÚBLICA de um emissor de DESENVOLVIMENTO (src/main/resources/publicKey.pem).
# O par privado, só para laboratório e testes, fica em src/test/resources/jwt/ (não é empacotado
# na aplicação) e é usado por scripts/mint-token.sh. NÃO use este par fora do laboratório.
# Em produção, aponte para a chave ou o JWKS do IdP real e troque o emissor, por exemplo:
#   mp.jwt.verify.publickey.location=https://idp.exemplo.gov.br/.well-known/jwks.json
#   mp.jwt.verify.issuer=https://idp.exemplo.gov.br/realms/governo
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://auditgov.local/dev-issuer
# Imagem nativa: embute o arquivo da chave.
quarkus.native.resources.includes=publicKey.pem

# ------------------------------------------------------------
# PostgreSQL 16 (docker-compose)
# ------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=audit_user
quarkus.datasource.password=audit_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/auditgov_db
quarkus.datasource.jdbc.max-size=16

# Desliga Dev Services: o banco já é fornecido pelo compose.
quarkus.devservices.enabled=false

# ------------------------------------------------------------
# Hibernate ORM / Panache
# ------------------------------------------------------------
# "update" é adequado para PoC. Em produção, versione o schema com Flyway, rode a
# aplicação com um papel que só tenha INSERT/SELECT em audit_log (db/audit-app-role.sql)
# e mantenha o dono da tabela fora da aplicação.
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# ------------------------------------------------------------
# OpenTelemetry -> Jaeger (OTLP HTTP 4318)
# ------------------------------------------------------------
quarkus.otel.enabled=true
quarkus.otel.traces.exporter=otlp
quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4318/v1/traces

# Amostragem: 100% na PoC para que todo acesso a dado pessoal tenha rastro.
# Atenção: se reduzir a amostragem em produção, a evidência no PostgreSQL continua
# completa, mas o trace correspondente pode não existir no Jaeger.
quarkus.otel.traces.sampler=always_on

# Propagação W3C Trace Context (traceparent/tracestate) + Baggage.
quarkus.otel.propagators=tracecontext,baggage

# Correlação nos logs da aplicação.
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] (%t) %s%e%n
quarkus.log.category."br.gov.auditgov".level=DEBUG

# ------------------------------------------------------------
# OpenAPI / Swagger (Anexo A)
# ------------------------------------------------------------
# Contrato em /q/openapi (?format=JSON para JSON) e console interativo em /q/swagger-ui,
# gerados a partir das anotações MicroProfile OpenAPI. Os arquivos openapi.yaml e
# openapi.json também são gravados em target/openapi durante o build (./mvnw package).
quarkus.smallrye-openapi.info-title=AuditGov API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de exemplo (dados fictícios) instrumentada pela \
  prova de conceito AuditGov, que registra cada acesso a dado de cidadão como evidência no \
  PostgreSQL e como span OpenTelemetry (Jaeger) com o mesmo trace_id, para apoiar o registro \
  das operações de tratamento previsto no Art. 37 da LGPD. Não garante conformidade por si só.
quarkus.smallrye-openapi.info-contact-name=Rafael Sabbadini Galego
quarkus.smallrye-openapi.info-contact-email=rafaelsabbadini8@gmail.com
quarkus.smallrye-openapi.store-schema-directory=target/openapi
# Mantém o Swagger UI acessível mesmo fora do modo dev/test (útil para o
# empacotamento usado na validação do Anexo A).
quarkus.swagger-ui.always-include=true
