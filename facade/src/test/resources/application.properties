# Perfil de teste da fachada.
# Porta própria para os testes (a padrão de teste do Quarkus, 8081, é a porta de execução da
# fachada). Não há banco: a fachada não grava nada.
quarkus.http.test-port=8091

# O "serviço de cidadãos" dos testes é um servidor HTTP falso (CidadaosFalso), subido pelo
# próprio teste nesta porta fixa.
quarkus.rest-client.citizen.url=http://127.0.0.1:18089

# Sem exportação de spans nos testes (o contexto continua sendo criado e propagado).
quarkus.otel.traces.exporter=none
