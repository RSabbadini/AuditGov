# ============================================================
# AuditGov - fachada (segundo serviço)
# ============================================================
quarkus.application.name=auditgov-facade
quarkus.application.version=1.0.0-SNAPSHOT
# O serviço de cidadãos usa a 8080.
quarkus.http.port=8081

# ------------------------------------------------------------
# Serviço de cidadãos (AuditGov principal)
# ------------------------------------------------------------
quarkus.rest-client.citizen.url=http://localhost:8080
quarkus.rest-client.citizen.connect-timeout=2000
quarkus.rest-client.citizen.read-timeout=5000

# Contingência: false = o traceparent é injetado pela instrumentação OpenTelemetry do Quarkus
# (o esperado). true = a fachada monta o cabeçalho a partir do span atual. Só ligue se o
# teste PropagacaoTest falhar por falta do cabeçalho.
facade.trace.manual-propagation=false

# ------------------------------------------------------------
# OpenTelemetry -> Jaeger (mesmo coletor do serviço principal, OTLP HTTP 4318)
# ------------------------------------------------------------
quarkus.otel.enabled=true
quarkus.otel.traces.exporter=otlp
quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4318/v1/traces
quarkus.otel.traces.sampler=always_on

# Propagação W3C Trace Context (traceparent/tracestate) + Baggage. Deve ser a mesma do serviço
# de cidadãos para que o contexto atravesse os dois.
quarkus.otel.propagators=tracecontext,baggage

# Correlação nos logs da aplicação.
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] (%t) %s%e%n
quarkus.log.category."br.gov.auditgov".level=DEBUG
