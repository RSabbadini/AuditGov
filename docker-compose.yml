services:
  postgres:
    image: postgres:16-alpine
    container_name: auditgov-postgres
    environment:
      POSTGRES_DB: auditgov_db
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
    ports:
      - "5432:5432"
    volumes:
      - auditgov_pgdata:/var/lib/postgresql/data
      # Scripts de inicialização (só rodam quando o volume é criado do zero).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d auditgov_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: auditgov-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

volumes:
  auditgov_pgdata:
