# Perfil de teste.
# Usa um banco SEPARADO (auditgov_test) no mesmo PostgreSQL do docker-compose, para que
# o drop-and-create abaixo nunca apague as evidências do banco de demonstração.
# O banco é criado por db/init/01-test-db.sql (volume novo) ou manualmente:
#   docker exec auditgov-postgres psql -U audit_user -d postgres -c "CREATE DATABASE auditgov_test"
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/auditgov_test
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.otel.traces.exporter=none

# Chave só para testes (não é a chave de desenvolvimento nem de produção).
auditgov.hmac.key=chave-somente-para-testes-0123456789abcdef
